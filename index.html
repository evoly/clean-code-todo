<!doctype html>
<html lang="en">
  <head>
    <title>Todo App</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="stylesheet" href="style.css" type="text/css" media="screen" />
  </head>

  <body>
    <header class="header">
      <img src="./eisenhower-matrix.jpg" alt="Eisenhower matrix" class="header-img" />
      <a class="header-link" href="https://goal-life.com/page/method/matrix-eisenhower">
        Want more details&quest;
      </a>
    </header>
    <main class="main">
      <div class="new-task">
        <label for="new-task" class="title">Add Item</label>
        <div class="task-row-wrapper">
          <input id="new-task" class="task" type="text" /> <button>Add</button>
        </div>
      </div>
      <h3 class="title">Todo</h3>
      <ul id="incomplete-tasks" class="list">
        <li class="list-item">
          <input type="checkbox" class="list-checkbox" /><label class="task list-label"
            >Pay Bills</label
          >
          <input type="text" class="task list-input" /><button class="edit">Edit</button>
          <button class="delete"><img src="./remove.svg" alt="remove icon" /></button>
        </li>
        <li class="edit-mode list-item">
          <input type="checkbox" class="list-checkbox" /><label class="task list-label"
            >Go Shopping</label
          >
          <input type="text" value="Go Shopping" class="task list-input" /><button class="edit">
            Save
          </button>
          <button class="delete"><img src="./remove.svg" alt="remove icon" /></button>
        </li>
      </ul>
      <h3 class="title">Completed</h3>
      <ul id="completed-tasks" class="list">
        <li class="list-item">
          <input type="checkbox" class="list-checkbox" checked /><label class="task list-label"
            >See the Doctor</label
          >
          <input type="text" class="task list-input" /><button class="edit">Edit</button>
          <button class="delete"><img src="./remove.svg" alt="remove icon" /></button>
        </li>
      </ul>
    </main>
    <script src="app.js"></script>
  </body>
</html>
